<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/style.css">
    <title>2PT-DMS | Authentication</title>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <div class="logo">
                <h1>2plus technologies </h1>
            </div>
            <p>Device Management & Support System</p>
        </div>

        <div class="tab-switcher">
            <button id="tab-login" class="tab-btn active">Sign In</button>
            <button id="tab-signup" class="tab-btn">Create Account</button>
        </div>

        <!-- LOGIN VIEW -->
        <div id="view-login" class="active">
            <h2>Welcome Back</h2>
            
            <div class="input-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" placeholder="your@email.com">
            </div>

            <div class="input-group">
                <div class="label-with-link">
                    <label for="login-password">Password</label>
                    <a class="link-forgot" id="forgot-password">Forgot?</a>
                </div>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>

            <button class="btn-primary" onclick="handleLogin()">Sign In</button>
            <p class="auth-footer">Don't have an account? <a onclick="switchTab('signup')">Sign up</a></p>
        </div>

        <!-- SIGNUP VIEW -->
        <div id="view-signup" class="hidden">
            <h2>Create Account</h2>

            <div class="account-type-group">
                <label class="section-label">Account Type</label>
                <div class="radio-group">
                    <label class="radio-option active" id="label-individual">
                        <input type="radio" name="account_type" value="individual" checked onchange="toggleAccountType('individual')">
                        <span class="radio-label">Individual</span>
                    </label>
                    <label class="radio-option" id="label-corporate">
                        <input type="radio" name="account_type" value="corporate" onchange="toggleAccountType('corporate')">
                        <span class="radio-label">Business</span>
                    </label>
                </div>
            </div>

            <div class="input-group">
                <label for="signup-firstname">First Name</label>
                <input type="text" id="signup-firstname" placeholder="John">
                </div>
                <div class="input-group">
                <label for="signup-lastname">Last Name</label>
                <input type="text" id="signup-lasttname" placeholder="Doe">
               
            </div>

            <div id="corporate-fields" class="conditional-fields hidden">
                <div class="input-group">
                    <label for="signup-orgname">Business Name</label>
                    <input type="text" id="signup-orgname" placeholder="Your Company Ltd">
                </div>
                <div class="input-group">
                    <label for="signup-orgreg">Registration Number</label>
                    <input type="text" id="signup-orgreg" placeholder="RC-1234567">
                </div>
            </div>

            <div class="input-group">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" placeholder="your@email.com">
            </div>

            <div class="input-group">
                <label for="signup-phone">Phone Number</label>
                <input type="tel" id="signup-phone" placeholder="+234 800 000 0000">
            </div>

            <div class="input-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Min. 8 characters">
            </div>
            <div class="input-group">
                <label for="address">Addres</label>
                <textarea id="address" placeholder="22 st street kano"></textarea>
                    
            </div>

            <button class="btn-primary" onclick="handleSignUp()">Create Account</button>
            <p class="auth-footer">Already have an account? <a onclick="switchTab('login')">Sign in</a></p>
        </div>

        <!-- FORGOT PASSWORD VIEW -->
        <div id="view-forgot" class="hidden">
            <div class="forgot-header">
                <h2 id="forgot-title">Reset Password</h2>
                <p id="forgot-subtitle">Enter your email to receive a verification code.</p>
            </div>

            <div class="input-group" id="step-1-group">
                <label for="reset-email">Email Address</label>
                <input type="email" id="reset-email" placeholder="your@email.com">
            </div>

            <div id="step-2-group" class="conditional-fields hidden">
                <div class="input-group">
                    <div class="label-with-link">
                        <label for="reset-otp">Verification Code</label>
                        <a class="link-forgot" onclick="resendOTP()">Resend</a>
                    </div>
                    <input type="text" id="reset-otp" maxlength="6" placeholder="000000">
                </div>

                <div class="input-group">
                    <label for="reset-new-password">New Password</label>
                    <input type="password" id="reset-new-password" placeholder="••••••••">
                </div>
            </div>

            <button id="btn-forgot-submit" class="btn-primary" onclick="handleForgotPassword()">Send Code</button>
            <button class="btn-secondary" onclick="switchTab('login')">Back to Sign In</button>
        </div>
    </div>

    <script src="static/script.js"></script>
</body>
    </html>
